defaults:
  - model: qwen35_0p8b_kda
  - data: hm3d_ovon
  - trainer: ovsegdt_e2e
  - eval: hm3d_ovon
  - serving: policy_server
  - _self_
seed: 2025
device: cuda:0
checkpoint: null
run_dir: runs/streamnav_active/ealm
habitat:
  python: runtime/habitat-env/bin/python
  gpu_device_id: 0
  width: 480
  height: 270
  sensor_height: 0.88
  sensor_pitch_deg: 0.0
  hfov: 120
  agent_height: 0.88
  agent_radius: 0.18
  navmesh_agent_max_climb: 0.10
  navmesh_cell_height: 0.05
  navmesh_cache: runtime/cache/navmesh
  forward_step: 0.25
  turn_angle: 30
  tilt_angle: 30
  oracle: objnav_explorer
  oracle_config:
    map_resolution: 128
    beeline_dist_thresh: 3.5
    visibility_dist: 3.0
    area_thresh: 1.5
  success_distance: 0.25
  max_episode_steps: 500
  timeout_s: 120
  reward:
    success_reward: 5.0
    slack_penalty: 0.001
    progress_scale: 0.0
    collision_penalty: 0.003
    false_stop_penalty: 0.0
distributed:
  gpu_offset: 0
  world_size: 1
  gradient_sync: ddp
hydra:
  run:
    dir: runtime/hydra/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
