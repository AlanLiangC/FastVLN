[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamnav"
version = "0.1.0"
description = "Streaming KDA-Qwen3.5 ObjectNav with joint DAgger/PPO training"
requires-python = ">=3.12"
dependencies = [
  "torch==2.10.0", "torchvision==0.25.0", "transformers==5.3.0",
  "flash-linear-attention==0.4.2", "hydra-core>=1.3,<1.4", "numpy>=1.26,<2",
  "pyzmq>=26", "pillow>=11", "safetensors>=0.5", "fastapi>=0.115",
  "uvicorn>=0.30", "imageio>=2.35", "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"streamnav.serving" = ["viewer.html"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and converted checkpoint", "habitat: requires real Habitat and data"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
