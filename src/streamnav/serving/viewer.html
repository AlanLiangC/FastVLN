<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamNav · Habitat 可视化</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111722;color:#e6ecf5}body{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:28px;font-weight:600}header p{color:#9baec4}main{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.panel{background:#1b2433;border:1px solid #304058;border-radius:14px;padding:20px}img{width:100%;image-rendering:auto;height:auto;aspect-ratio:16/9;object-fit:contain;background:#10151d;border-radius:8px}button,select,input{font:inherit;color:inherit;background:#28374b;border:1px solid #465d7a;border-radius:7px;padding:9px;margin:4px 3px 4px 0}button{cursor:pointer}button.primary{background:#236aab}button:disabled{opacity:.45;cursor:default}.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.bar{height:10px;background:#0d141f;border-radius:5px;margin:4px 0 14px}.bar i{display:block;height:100%;background:#56c5ba;border-radius:5px}#goal{font-size:21px;min-height:32px}#status{color:#adc4df;white-space:pre-wrap}#error{color:#ffb0a9}pre{font-size:12px;overflow:auto;max-height:250px}.hint{font-size:13px;color:#9baec4}input{width:65px}#checkpoint{word-break:break-all}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
<header><h1>StreamNav <span style="color:#56c5ba">/</span> Habitat</h1><p>真实 HM3D 场景 · RGB 流式策略 · 四动作导航</p></header>
<main><section class="panel"><div id="goal">选择验证 episode，加载场景</div><img id="frame" alt="Habitat 实时 RGB 画面"><div class="row"><select id="split" aria-label="验证集"></select><label>验证样本 <input id="episode" type="number" value="0" min="0" max="1000"></label><button id="reset" class="primary">加载 / 重置</button></div><div class="row"><select id="examples" aria-label="选择验证样本" style="max-width:100%"><option>读取验证样本…</option></select></div><div class="row"><button id="once" disabled>模型单步</button><button id="auto" disabled>模型自动运行</button><button id="pause">暂停</button></div><div class="row"><span>手动：</span><button class="manual" data-action="2" disabled>左转</button><button class="manual" data-action="1" disabled>前进</button><button class="manual" data-action="3" disabled>右转</button><button class="manual" data-action="0" disabled>STOP</button></div><p class="hint">自动运行使用模型 argmax 动作。手动控制用于观察环境，手动轨迹不代表模型成绩。下拉列表包含成功和失败样本，沿用定期验证的原始起点。点击加载 / 重置时更新所选检查点。</p><p id="sensor" class="hint"></p><p id="error"></p></section><section class="panel"><h3>策略与导航状态</h3><p id="status">等待场景</p><div id="bars"></div><h3>已加载的 checkpoint</h3><p id="checkpoint" class="hint"></p><h3>最近训练 / 验证</h3><pre id="training">暂无记录</pre></section></main>
<script>
const $=id=>document.getElementById(id);let running=false,busy=false,ready=false;
const labels=['STOP','MOVE_FORWARD','TURN_LEFT','TURN_RIGHT'];
$('bars').innerHTML=labels.map((s,i)=>`<div>${s} <span id="p${i}">—</span></div><div class="bar"><i id="b${i}" style="width:0%"></i></div>`).join('');
async function api(path,data){let r=await fetch(path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.detail||r.statusText);return j}
function controls(){for(let b of [$('once'),$('auto'),...document.querySelectorAll('.manual')])b.disabled=!ready||busy||running;$('reset').disabled=busy||running}
function display(j){if(j.checkpoint)$('checkpoint').textContent=j.checkpoint;$('frame').src='data:image/jpeg;base64,'+j.rgb_base64;if(j.instruction)$('goal').textContent=j.instruction;if(j.robot){let r=j.robot;$('sensor').textContent=`${r.width}×${r.height} · HFOV ${r.hfov}° · 相机 ${r.sensor_height.toFixed(2)} m / ${r.sensor_pitch_deg.toFixed(0)}° · 机体 ${r.agent_height.toFixed(2)} m / 半径 ${r.agent_radius.toFixed(2)} m`;}if(j.probabilities)j.probabilities.forEach((p,i)=>{$('p'+i).textContent=(p*100).toFixed(1)+'%';$('b'+i).style.width=(p*100)+'%'});let m=j.metrics;$('status').textContent=m?`执行：${j.executed_action}${j.manual?'（手动）':''}\n步数：${m.episode_length}　距离：${m.distance_to_goal.toFixed(2)} m\n成功：${m.success?'是':'否'}　SPL：${m.spl.toFixed(3)}\n状态缓存：${(j.state_bytes/1048576).toFixed(2)} MiB${j.done?'\nEpisode 已结束，请重置。':''}`:`起始距离：${j.distance.toFixed(2)} m`;if(j.done){ready=false;running=false}}
async function advance(action=null){if(busy||!ready)return;busy=true;controls();try{display(await api('/demo/step',{action}));$('error').textContent=''}catch(e){running=false;$('error').textContent=e.message}finally{busy=false;controls()}if(running)setTimeout(()=>advance(),50)}
$('reset').onclick=async()=>{running=false;busy=true;controls();try{display(await api('/demo/reset',{episode_index:Number($('episode').value),split_index:Number($('split').value)}));ready=true;await loadExamples();$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{busy=false;controls()}};
$('once').onclick=()=>advance();$('auto').onclick=()=>{running=true;advance()};$('pause').onclick=()=>{running=false;controls()};document.querySelectorAll('.manual').forEach(b=>b.onclick=()=>advance(Number(b.dataset.action)));
async function loadExamples(){let j=await api('/demo/episodes?split_index='+$('split').value);$('examples').replaceChildren();for(let e of j.episodes){let o=document.createElement('option');o.value=e.index;o.textContent=`#${e.index} · ${e.goal} · ${e.success===1?'验证成功':e.success===0?'验证未成功':'未评估'}`;$('examples').append(o)}$('examples').value=$('episode').value;$('episode').max=j.episodes.length-1}
$('examples').onchange=()=>{$('episode').value=$('examples').value};$('episode').onchange=()=>{$('examples').value=$('episode').value};$('split').onchange=()=>{$('episode').value=0;loadExamples().catch(e=>$('error').textContent=e.message)};
api('/health').then(async j=>{$('checkpoint').textContent=j.checkpoint;j.splits.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=s;$('split').append(o)});await loadExamples()}).catch(e=>$('error').textContent=e.message);
async function training(){try{let h=await api('/health');$('checkpoint').textContent=h.checkpoint+(h.new_checkpoint_available?'\n已有新检查点；加载 / 重置时自动更新。':'');$('training').textContent=JSON.stringify(await api('/training'),null,2)}catch(e){$('training').textContent=e.message}}training();setInterval(training,30000);
</script></html>
